<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8eb">
  <title>Our Little Game World</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", system-ui, sans-serif;
      color: #282344;
      background: #fff8eb;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    main {
      width: min(100% - 2rem, 58rem);
      margin-inline: auto;
      padding-block: clamp(2rem, 6vw, 4.5rem) 2.5rem;
    }

    header {
      text-align: center;
      margin-bottom: clamp(1.75rem, 5vw, 3rem);
    }

    .rainbow {
      width: 6rem;
      height: 3rem;
      margin: 0 auto 1rem;
      border-radius: 6rem 6rem 0 0;
      background: radial-gradient(
        circle at 50% 100%,
        #fff8eb 0 26%,
        #88d7b2 27% 44%,
        #ffcf65 45% 62%,
        #ff9d8f 63% 80%,
        #b8a0f1 81%
      );
    }

    h1 {
      max-width: 17ch;
      margin: 0 auto;
      font-size: clamp(2.55rem, 8vw, 5rem);
      line-height: 1;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    header p {
      max-width: 34ch;
      margin: 1rem auto 0;
      color: #514767;
      font-size: clamp(1.05rem, 3vw, 1.25rem);
      line-height: 1.5;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(1rem, 3vw, 1.5rem);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .game {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 0.8rem;
      min-height: 14rem;
      padding: 1.5rem 1rem;
      border: 2px solid #282344;
      border-radius: 1.7rem;
      box-shadow: 0 5px 0 #282344;
      text-align: center;
    }

    .snakes { background: #c5edb5; }
    .matching { background: #ffe190; }
    .drawing { background: #ffd0e1; }
    .connect { background: #cde2ff; }

    .picture {
      display: grid;
      place-items: center;
      width: 7.5rem;
      height: 4.75rem;
      border-radius: 1.3rem;
      background: #ffffffb8;
      font-size: 2.55rem;
      line-height: 1;
    }

    .game h2 {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 2rem);
      line-height: 1.12;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .status {
      margin: 0;
      padding: 0.35rem 0.75rem;
      border-radius: 2rem;
      color: #282344;
      background: #fffdf7;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .discs {
      display: grid;
      grid-template-columns: repeat(4, 0.8rem);
      gap: 0.25rem;
      padding: 0.45rem;
      border-radius: 0.6rem;
      background: #3155a4;
    }

    .discs span {
      width: 0.8rem;
      height: 0.8rem;
      border-radius: 50%;
      background: #edf4ff;
    }

    .discs .red { background: #ff8d8d; }
    .discs .yellow { background: #ffd35e; }

    @media (max-width: 36rem) {
      .games { grid-template-columns: 1fr; }
      .game { min-height: 12rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="rainbow" aria-hidden="true"></div>
      <h1>Our Little Game World</h1>
      <p>Pick a game, then share the room code to play together on two devices.</p>
    </header>

    <ul class="games" aria-label="Family games" role="list">
      <li class="game snakes">
        <div class="picture" aria-hidden="true">🐍 🪜</div>
        <h2>Snakes &amp; Ladders</h2>
        <p class="status"><a href="https://our-little-game-world.onrender.com/">Play online</a></p>
      </li>

      <li class="game matching">
        <div class="picture" aria-hidden="true">⭐ ⭐</div>
        <h2>Matching Pairs</h2>
        <p class="status"><a href="https://our-little-game-world.onrender.com/">Play online</a></p>
      </li>

      <li class="game drawing">
        <div class="picture" aria-hidden="true">🎨 🖍️</div>
        <h2>Drawing Together</h2>
        <p class="status"><a href="https://our-little-game-world.onrender.com/">Draw online</a></p>
      </li>

      <li class="game connect">
        <div class="picture" aria-hidden="true">
          <div class="discs">
            <span></span><span></span><span class="yellow"></span><span></span>
            <span></span><span class="red"></span><span class="yellow"></span><span></span>
            <span class="red"></span><span class="yellow"></span><span class="red"></span><span class="red"></span>
          </div>
        </div>
        <h2>Connect 4</h2>
        <p class="status"><a href="https://our-little-game-world.onrender.com/">Play online</a></p>
      </li>
    </ul>
  </main>
</body>
</html>
